# Deploy to Fly.io on every push to main: one app serves the web page and the API (https://mons-carlo.fly.dev).
# Needs the repo secret FLY_API_TOKEN (a deploy token: fly tokens create deploy -a mons-carlo).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --wait-timeout 15m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
